<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 960" role="img" aria-labelledby="title desc">
<title id="title">Retail recommendation: approved Medallion, Star Schema and GPU ALS architecture</title>
<desc id="desc">PySpark ingests events and products into Bronze Delta on MinIO. Silver cleans events and products. The Gold Star Schema warehouse feeds dashboards and the temporal ML mart. Spark SQL serves dashboards; GPU Implicit ALS, Popularity and RepeatPop produce Top-10 recommendations and evaluation. Versioned artifacts support reproducibility.</desc>
<defs>
  <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
  <style>
    .txt{font:600 20px Arial,Helvetica,sans-serif;fill:#1e293b}
    .small{font:400 16px Arial,Helvetica,sans-serif;fill:#475569}
    .head{font:700 21px Arial,Helvetica,sans-serif;fill:#0f172a}
    .arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arr)}
    .node{stroke-width:2;rx:12}
  </style>
</defs>
